<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Colour: mixing light — and writing it in hex</text>

  <!-- ===== additive circles ===== -->
  <text x="225" y="66" text-anchor="middle" font-size="14" fill="#3a4250">add red, green and blue light</text>
  <g style="isolation:isolate">
    <rect x="90" y="80" width="270" height="250" rx="8" fill="#000000"/>
    <circle cx="225" cy="150" r="74" fill="#ff0000" style="mix-blend-mode:screen"/>
    <circle cx="190" cy="215" r="74" fill="#00ff00" style="mix-blend-mode:screen"/>
    <circle cx="260" cy="215" r="74" fill="#0000ff" style="mix-blend-mode:screen"/>
  </g>
  <g font-size="11" fill="#111" text-anchor="middle">
    <text x="196" y="168">yellow</text>
    <text x="256" y="168">magenta</text>
    <text x="225" y="192" fill="#333">white</text>
    <text x="225" y="250">cyan</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="225" y="104" fill="#ff5555">R</text>
    <text x="150" y="300" fill="#33bb33">G</text>
    <text x="300" y="300" fill="#6688ff">B</text>
  </g>

  <!-- ===== hex layout ===== -->
  <text x="650" y="66" text-anchor="middle" font-size="14" fill="#3a4250">write it as one number: <tspan font-family="monospace" font-weight="bold">0xRRGGBB</tspan></text>

  <!-- example number -->
  <text x="560" y="128" font-size="30" font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#23272e">0x<tspan fill="#c0392b">FF</tspan><tspan fill="#1e8449">D7</tspan><tspan fill="#1f5fbf">00</tspan></text>
  <text x="760" y="118" font-size="16" fill="#5b6b7f">=</text>
  <rect x="782" y="98" width="52" height="42" rx="4" fill="#FFD700" stroke="#8a7400" stroke-width="1.5"/>
  <text x="808" y="158" text-anchor="middle" font-size="12" fill="#3a4250">gold</text>

  <!-- channel breakdown -->
  <g font-size="13" fill="#23272e">
    <text x="470" y="204" font-family="monospace" font-weight="bold" fill="#c0392b">R  FF</text><text x="556" y="204" fill="#5b6b7f">= 255  (full red)</text>
    <rect x="700" y="192" width="150" height="15" rx="2" fill="#eef0f3"/><rect x="700" y="192" width="150" height="15" rx="2" fill="#cc3a3a"/>
    <text x="470" y="238" font-family="monospace" font-weight="bold" fill="#1e8449">G  D7</text><text x="556" y="238" fill="#5b6b7f">= 215  (lots of green)</text>
    <rect x="700" y="226" width="150" height="15" rx="2" fill="#eef0f3"/><rect x="700" y="226" width="126" height="15" rx="2" fill="#2e8b57"/>
    <text x="470" y="272" font-family="monospace" font-weight="bold" fill="#1f5fbf">B  00</text><text x="556" y="272" fill="#5b6b7f">= 0    (no blue)</text>
    <rect x="700" y="260" width="150" height="15" rx="2" fill="#eef0f3"/>
  </g>

  <text x="650" y="322" text-anchor="middle" font-size="12.5" fill="#3a4250">Two hex digits per channel, each 0–255. <tspan font-family="monospace">00</tspan> = off, <tspan font-family="monospace">FF</tspan> = full on.</text>
  <text x="650" y="344" text-anchor="middle" font-size="12" fill="#5b6b7f">All off = black; all full = white; the same recipe as the lights on the left.</text>
</svg>
