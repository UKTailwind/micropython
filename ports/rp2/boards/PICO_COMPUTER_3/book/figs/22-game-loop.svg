<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="450" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The game loop</text>
  <text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b6b7f">the shape every game shares — one pass per frame</text>

  <!-- pacing label -->
  <line x1="176" y1="78" x2="176" y2="326" stroke="#8a94a3" stroke-width="1.5"/>
  <line x1="171" y1="78" x2="181" y2="78" stroke="#8a94a3" stroke-width="1.5"/>
  <line x1="171" y1="326" x2="181" y2="326" stroke="#8a94a3" stroke-width="1.5"/>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#5b6b7f" transform="rotate(-90 150 196)">one frame · dt = clock.tick()</text>

  <!-- input -->
  <rect x="210" y="76" width="300" height="60" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="210" y="76" width="8" height="60" rx="3" fill="#1f5fbf"/>
  <text x="234" y="104" font-size="15" font-weight="bold" fill="#23272e">① read the input</text>
  <text x="234" y="124" font-size="11.5" fill="#5b6b7f">what does the player want?</text>

  <line x1="360" y1="136" x2="360" y2="168" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- update -->
  <rect x="210" y="170" width="300" height="60" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="210" y="170" width="8" height="60" rx="3" fill="#c88a00"/>
  <text x="234" y="198" font-size="15" font-weight="bold" fill="#23272e">② update the world</text>
  <text x="234" y="218" font-size="11.5" fill="#5b6b7f">physics, collisions, scores, rules</text>

  <line x1="360" y1="230" x2="360" y2="262" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- draw -->
  <rect x="210" y="264" width="300" height="60" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="210" y="264" width="8" height="60" rx="3" fill="#2e8b57"/>
  <text x="234" y="292" font-size="15" font-weight="bold" fill="#23272e">③ draw the world</text>
  <text x="234" y="312" font-size="11.5" fill="#5b6b7f">one complete picture</text>

  <!-- loop back -->
  <path d="M510,294 L600,294 L600,106 L514,106" fill="none" stroke="#8a94a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="612" y="200" font-size="12" fill="#5b6b7f" transform="rotate(-90 612 200)">next frame</text>

  <text x="360" y="378" text-anchor="middle" font-size="13.5" fill="#3a4250">Each phase finishes before the next begins — no leaking between them.</text>
  <text x="360" y="402" text-anchor="middle" font-size="12.5" fill="#5b6b7f">Solid games keep the three apart; buggy ones let them bleed together.</text>
</svg>
