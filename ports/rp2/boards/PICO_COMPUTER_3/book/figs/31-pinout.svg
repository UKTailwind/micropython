<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="900" height="510" fill="#ffffff"/>
  <text x="270" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The I/O header</text>
  <text x="270" y="56" text-anchor="middle" font-size="12.5" fill="#5b6b7f">15 pin-pairs, as silk-screened on the board</text>

  <!-- connector body -->
  <rect x="188" y="86" width="164" height="380" rx="9" fill="#2a2f36"/>

  <!-- pads + labels; left cx=232, right cx=308; labels flank at 150 / 390 -->
  <g font-size="12.5" fill="#23272e">
    <!-- r1 -->
    <text x="150" y="114" text-anchor="end" fill="#5a3fa6">GP21</text><circle cx="232" cy="110" r="8" fill="#7a5cc0" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="110" r="8" fill="#4a4f57" stroke="#fff" stroke-width="1.5"/><text x="390" y="114">GND</text>
    <!-- r2 -->
    <text x="150" y="138" text-anchor="end" fill="#5a3fa6">GP20</text><circle cx="232" cy="134" r="8" fill="#7a5cc0" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="134" r="8" fill="#cc3a3a" stroke="#fff" stroke-width="1.5"/><text x="390" y="138" fill="#a5301f">+5V</text>
    <!-- r3 -->
    <text x="150" y="162" text-anchor="end" fill="#256b3d">GP45</text><circle cx="232" cy="158" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="158" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><text x="390" y="162" fill="#256b3d">GP46</text>
    <!-- r4 -->
    <text x="150" y="186" text-anchor="end" fill="#256b3d">GP43</text><circle cx="232" cy="182" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="182" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><text x="390" y="186" fill="#256b3d">GP44</text>
    <!-- r5 -->
    <text x="150" y="210" text-anchor="end" fill="#256b3d">GP41</text><circle cx="232" cy="206" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="206" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><text x="390" y="210" fill="#256b3d">GP42</text>
    <!-- r6 -->
    <text x="150" y="234" text-anchor="end">GP39</text><circle cx="232" cy="230" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="230" r="8" fill="#3a9a5a" stroke="#fff" stroke-width="1.5"/><text x="390" y="234" fill="#256b3d">GP40</text>
    <!-- r7 -->
    <text x="150" y="258" text-anchor="end">GP37</text><circle cx="232" cy="254" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="254" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="258">GP38</text>
    <!-- r8 -->
    <text x="150" y="282" text-anchor="end">GP35</text><circle cx="232" cy="278" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="278" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="282">GP36</text>
    <!-- r9 -->
    <text x="150" y="306" text-anchor="end">GP26</text><circle cx="232" cy="302" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="302" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="306">GP34</text>
    <!-- r10 -->
    <text x="150" y="330" text-anchor="end">GP07</text><circle cx="232" cy="326" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="326" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="330">GP06</text>
    <!-- r11 -->
    <text x="150" y="354" text-anchor="end">GP05</text><circle cx="232" cy="350" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="350" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="354">GP04</text>
    <!-- r12 -->
    <text x="150" y="378" text-anchor="end">GP03</text><circle cx="232" cy="374" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="374" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="378">GP02</text>
    <!-- r13 -->
    <text x="150" y="402" text-anchor="end">GP01</text><circle cx="232" cy="398" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="398" r="8" fill="#7fb0d8" stroke="#fff" stroke-width="1.5"/><text x="390" y="402">GP00</text>
    <!-- r14 -->
    <text x="150" y="426" text-anchor="end" fill="#9a5c00">VCC</text><circle cx="232" cy="422" r="8" fill="#e08a1e" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="422" r="8" fill="#e08a1e" stroke="#fff" stroke-width="1.5"/><text x="390" y="426" fill="#9a5c00">VCC</text>
    <!-- r15 -->
    <text x="150" y="450" text-anchor="end">GND</text><circle cx="232" cy="446" r="8" fill="#4a4f57" stroke="#fff" stroke-width="1.5"/><circle cx="308" cy="446" r="8" fill="#4a4f57" stroke="#fff" stroke-width="1.5"/><text x="390" y="450">GND</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#3a4250">
    <text x="560" y="96" font-size="15" font-weight="bold" fill="#23272e">Key</text>
    <rect x="560" y="110" width="18" height="16" fill="#e08a1e"/><text x="586" y="123">3.3 V (VCC) out</text>
    <rect x="560" y="136" width="18" height="16" fill="#cc3a3a"/><text x="586" y="149">5 V — powers things only</text>
    <rect x="560" y="162" width="18" height="16" fill="#4a4f57"/><text x="586" y="175">GND</text>
    <rect x="560" y="188" width="18" height="16" fill="#7a5cc0"/><text x="586" y="201">I2C0 bus (GP20 SDA, GP21 SCL)</text>
    <rect x="560" y="214" width="18" height="16" fill="#3a9a5a"/><text x="586" y="227">ADC-capable (GP40–46)</text>
    <rect x="560" y="240" width="18" height="16" fill="#7fb0d8"/><text x="586" y="253">GPIO — any pin also does PWM</text>
  </g>

  <!-- notes -->
  <g font-size="12.5" fill="#3a4250">
    <text x="560" y="300" font-weight="bold" fill="#23272e">Watch out</text>
    <text x="560" y="324">• GP20/21 are the I2C bus — shared with the QWIIC</text>
    <text x="574" y="342">socket and the DS3231; use as a bus, not plain pins.</text>
    <text x="560" y="366">• 3.3 V logic. Never feed 5 V into a GP pin —</text>
    <text x="574" y="384">the 5 V pin is for powering servos and the like.</text>
    <text x="560" y="408">• GP40–46 also read analogue voltages (ADC).</text>
    <text x="560" y="432">• Avoid GP25 — it belongs to the wireless module.</text>
  </g>
</svg>
