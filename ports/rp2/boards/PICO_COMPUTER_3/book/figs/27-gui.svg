<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The GUI model: describe, then poll</text>

  <!-- ===== left: the screen you describe ===== -->
  <rect x="56" y="80" width="330" height="248" rx="6" fill="#0c0c16" stroke="#5b6b7f" stroke-width="1.6"/>
  <text x="221" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#e7c000">FIRST CONTACT</text>
  <!-- LED -->
  <circle cx="120" cy="176" r="12" fill="#2ecc71" stroke="#0a0a12" stroke-width="1"/>
  <text x="120" y="204" text-anchor="middle" font-size="11.5" fill="#c8ccd2">status</text>
  <!-- switch -->
  <rect x="185" y="162" width="110" height="30" rx="15" fill="#33404e"/>
  <circle cx="278" cy="177" r="12" fill="#2ecc71"/>
  <text x="215" y="181" text-anchor="middle" font-size="11" fill="#fff">ON</text>
  <!-- quit -->
  <rect x="166" y="256" width="110" height="36" rx="5" fill="#cc3a3a"/>
  <text x="221" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">QUIT</text>
  <text x="221" y="350" text-anchor="middle" font-size="12.5" fill="#3a4250">controls you lay out on the screen</text>

  <!-- ===== right: describe -> poll ===== -->
  <rect x="446" y="76" width="394" height="52" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="462" y="98" font-size="13.5" font-weight="bold" fill="#23272e">① describe</text>
  <text x="462" y="118" font-size="12" fill="#3a4250">g = GUI(); add controls — each with a callback</text>

  <text x="446" y="156" font-size="13.5" font-weight="bold" fill="#23272e">② poll — one loop dispatches everything</text>

  <g font-size="12.5" fill="#23272e">
    <rect x="470" y="168" width="350" height="36" rx="5" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.4"/>
    <text x="645" y="191" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">g.poll()</text>
    <line x1="645" y1="204" x2="645" y2="222" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="470" y="224" width="350" height="36" rx="5" fill="#f7f9fc" stroke="#5b6b7f" stroke-width="1.2"/>
    <text x="645" y="247" text-anchor="middle">a control is clicked or touched</text>
    <line x1="645" y1="260" x2="645" y2="278" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="470" y="280" width="350" height="36" rx="5" fill="#f7f9fc" stroke="#5b6b7f" stroke-width="1.2"/>
    <text x="645" y="303" text-anchor="middle">poll calls your callback(control)</text>
    <line x1="645" y1="316" x2="645" y2="334" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="470" y="336" width="350" height="36" rx="5" fill="#f7f9fc" stroke="#5b6b7f" stroke-width="1.2"/>
    <text x="645" y="359" text-anchor="middle">.value updates → the control redraws</text>
  </g>
  <!-- loop back -->
  <path d="M820,354 L838,354 L838,186 L822,186" fill="none" stroke="#8a94a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="430" y="408" text-anchor="middle" font-size="12.5" fill="#3a4250">Nothing happens except inside <tspan font-family="monospace">g.poll()</tspan> — which is why the loop must keep calling it.</text>
</svg>
