<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>

  <!-- figure background (keeps the figure legible on any reader theme) -->
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Screen coordinates — RGB640 (640 × 480)</text>

  <!-- the screen: 640x480 mapped to a 560x420 box at (100,90), scale 0.875 -->
  <!-- faint pixel-grid, every 80 screen pixels -->
  <g stroke="#dbe2ea" stroke-width="1">
    <line x1="170" y1="90" x2="170" y2="510"/>
    <line x1="240" y1="90" x2="240" y2="510"/>
    <line x1="310" y1="90" x2="310" y2="510"/>
    <line x1="380" y1="90" x2="380" y2="510"/>
    <line x1="450" y1="90" x2="450" y2="510"/>
    <line x1="520" y1="90" x2="520" y2="510"/>
    <line x1="590" y1="90" x2="590" y2="510"/>
    <line x1="100" y1="160" x2="660" y2="160"/>
    <line x1="100" y1="230" x2="660" y2="230"/>
    <line x1="100" y1="300" x2="660" y2="300"/>
    <line x1="100" y1="370" x2="660" y2="370"/>
    <line x1="100" y1="440" x2="660" y2="440"/>
  </g>
  <rect x="100" y="90" width="560" height="420" fill="#eef3f8" fill-opacity="0.35" stroke="#5b6b7f" stroke-width="2"/>

  <!-- x axis arrow (above the top edge) -->
  <line x1="100" y1="70" x2="380" y2="70" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="60" font-size="15" fill="#23272e">x  (0 → 639), rightwards</text>

  <!-- y axis arrow (left of the frame), pointing DOWN -->
  <line x1="78" y1="90" x2="78" y2="360" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text transform="translate(64,300) rotate(-90)" text-anchor="middle" font-size="15" fill="#23272e">y  (0 → 479), downwards</text>

  <!-- guide lines from the sample point (200,150) -> svg (275, 221.25) -->
  <g stroke="#C08300" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="275" y1="90" x2="275" y2="221"/>
    <line x1="100" y1="221" x2="275" y2="221"/>
  </g>
  <text x="275" y="84" text-anchor="middle" font-size="13" fill="#8a5e00">x = 200</text>
  <text x="94" y="225" text-anchor="end" font-size="13" fill="#8a5e00">y = 150</text>

  <!-- corner + centre + sample dots -->
  <g fill="#23272e">
    <circle cx="100" cy="90" r="4.5"/>
    <circle cx="660" cy="90" r="3.5"/>
    <circle cx="100" cy="510" r="3.5"/>
    <circle cx="660" cy="510" r="3.5"/>
    <circle cx="380" cy="300" r="4.5"/>
  </g>
  <!-- sample point in gold -->
  <circle cx="275" cy="221" r="6" fill="#E0A81E" stroke="#8a5e00" stroke-width="1.5"/>

  <!-- coordinate labels -->
  <g font-size="14" fill="#23272e">
    <text x="112" y="112" font-weight="bold">(0, 0)</text>
    <text x="648" y="112" text-anchor="end">(639, 0)</text>
    <text x="112" y="500">(0, 479)</text>
    <text x="648" y="500" text-anchor="end">(639, 479)</text>
    <text x="392" y="296" fill="#3a4250">centre (320, 240)</text>
    <text x="286" y="216" font-weight="bold" fill="#8a5e00">(200, 150)</text>
  </g>

  <!-- note -->
  <text x="390" y="544" text-anchor="middle" font-size="13" fill="#5b6b7f">y increases <tspan font-style="italic">downward</tspan> — the legacy of TV tubes scanning top to bottom.</text>
</svg>
