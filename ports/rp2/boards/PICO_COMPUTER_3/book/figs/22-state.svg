<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Game state — one variable, a whole architecture</text>

  <!-- TITLE -->
  <rect x="40" y="104" width="220" height="94" rx="8" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="40" y="104" width="220" height="9" rx="4" fill="#1f5fbf"/>
  <text x="150" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5fbf">"title"</text>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#3a4250">wait for SPACE</text>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#3a4250">draw the logo</text>

  <!-- PLAY -->
  <rect x="320" y="104" width="220" height="94" rx="8" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="320" y="104" width="220" height="9" rx="4" fill="#c88a00"/>
  <text x="430" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#c88a00">"play"</text>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#3a4250">read input, move the ball</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#3a4250">check collisions and score</text>

  <!-- OVER -->
  <rect x="600" y="104" width="220" height="94" rx="8" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <rect x="600" y="104" width="220" height="9" rx="4" fill="#b3402e"/>
  <text x="710" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#b3402e">"over"</text>
  <text x="710" y="164" text-anchor="middle" font-size="12" fill="#3a4250">show the winner</text>
  <text x="710" y="182" text-anchor="middle" font-size="12" fill="#3a4250">offer another go</text>

  <!-- transitions -->
  <line x1="260" y1="151" x2="318" y2="151" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="289" y="142" text-anchor="middle" font-size="12" fill="#23272e">SPACE</text>
  <line x1="540" y1="151" x2="598" y2="151" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="569" y="142" text-anchor="middle" font-size="12" fill="#23272e">round ends</text>

  <!-- loop back over -> title -->
  <path d="M710,198 L710,258 L150,258 L150,200" fill="none" stroke="#8a94a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#5b6b7f">SPACE — play again</text>

  <text x="430" y="316" text-anchor="middle" font-size="13.5" fill="#3a4250">One loop runs everything; a <tspan font-family="monospace">state</tspan> string picks what input, update and draw mean this frame.</text>
  <text x="430" y="340" text-anchor="middle" font-size="12.5" fill="#5b6b7f">Changing screens is just an assignment — <tspan font-family="monospace">state = "over"</tspan> — and the loop, clock and display never notice.</text>
</svg>
