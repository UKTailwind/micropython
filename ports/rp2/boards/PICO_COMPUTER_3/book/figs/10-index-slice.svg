<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Indexing and slicing a list</text>

  <!-- ===== Panel A: indexing ===== -->
  <g font-size="13" text-anchor="middle" fill="#1f5fbf" font-weight="bold">
    <text x="155" y="106">0</text><text x="245" y="106">1</text><text x="335" y="106">2</text><text x="425" y="106">3</text><text x="515" y="106">4</text><text x="605" y="106">5</text>
  </g>
  <g>
    <rect x="110" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="200" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="290" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="380" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="470" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="560" y="116" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#23272e">
    <text x="155" y="150">90</text><text x="245" y="150">75</text><text x="335" y="150">82</text><text x="425" y="150">66</text><text x="515" y="150">91</text><text x="605" y="150">43</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#6b7280">
    <text x="155" y="192">−6</text><text x="245" y="192">−5</text><text x="335" y="192">−4</text><text x="425" y="192">−3</text><text x="515" y="192">−2</text><text x="605" y="192">−1</text>
  </g>
  <text x="410" y="220" text-anchor="middle" font-size="13" fill="#3a4250"><tspan font-family="monospace">scores[i]</tspan> → the item · count <tspan fill="#1f5fbf" font-weight="bold">0</tspan> from the front, <tspan fill="#6b7280" font-weight="bold">−1</tspan> from the back</text>

  <!-- ===== Panel B: slicing ===== -->
  <g font-size="12.5" text-anchor="middle" fill="#8a5e00">
    <text x="110" y="266">0</text><text x="200" y="266">1</text><text x="290" y="266">2</text><text x="380" y="266">3</text><text x="470" y="266">4</text><text x="560" y="266">5</text><text x="650" y="266">6</text>
  </g>
  <g stroke="#c88a00" stroke-width="1.4">
    <line x1="110" y1="270" x2="110" y2="282"/><line x1="200" y1="270" x2="200" y2="282"/><line x1="290" y1="270" x2="290" y2="282"/><line x1="380" y1="270" x2="380" y2="282"/><line x1="470" y1="270" x2="470" y2="282"/><line x1="560" y1="270" x2="560" y2="282"/><line x1="650" y1="270" x2="650" y2="282"/>
  </g>
  <g>
    <rect x="110" y="282" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="200" y="282" width="90" height="54" fill="#fbe9c8" stroke="#c88a00" stroke-width="1.8"/>
    <rect x="290" y="282" width="90" height="54" fill="#fbe9c8" stroke="#c88a00" stroke-width="1.8"/>
    <rect x="380" y="282" width="90" height="54" fill="#fbe9c8" stroke="#c88a00" stroke-width="1.8"/>
    <rect x="470" y="282" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <rect x="560" y="282" width="90" height="54" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#23272e">
    <text x="155" y="316">90</text><text x="245" y="316">75</text><text x="335" y="316">82</text><text x="425" y="316">66</text><text x="515" y="316">91</text><text x="605" y="316">43</text>
  </g>
  <!-- slice bracket 1..4 -->
  <path d="M200,346 L200,354 L470,354 L470,346" fill="none" stroke="#c88a00" stroke-width="1.8"/>
  <text x="410" y="376" text-anchor="middle" font-size="13.5" fill="#3a4250"><tspan font-family="monospace" font-weight="bold" fill="#8a5e00">scores[1:4]</tspan> → <tspan font-family="monospace">[75, 82, 66]</tspan> · items 1 up to (not including) 4 — the numbers mark the gaps</text>
</svg>
