<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="516" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The three buffers — and what the monitor shows</text>

  <!-- ===== top row: the three buffers ===== -->
  <!-- F: off-screen buffer, just a dot -->
  <rect x="60" y="72" width="175" height="128" fill="#f4f6f9"/>
  <circle cx="147" cy="136" r="18" fill="#e0a81e"/>
  <rect x="60" y="72" width="175" height="128" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="147" y="62"  text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">F — off-screen buffer</text>
  <text x="147" y="217" text-anchor="middle" font-size="11.5" fill="#5b6b7f">hidden — draw a frame, then copy</text>

  <!-- N: base buffer, scenery only -->
  <rect x="362" y="72" width="175" height="78" fill="#d8ecfb"/>
  <rect x="362" y="150" width="175" height="50" fill="#d4ecc6"/>
  <circle cx="505" cy="102" r="18" fill="#e7b62e"/>
  <rect x="362" y="72" width="175" height="128" fill="none" stroke="#5b6b7f" stroke-width="2.5"/>
  <text x="449" y="62"  text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">N — base buffer</text>
  <text x="449" y="217" text-anchor="middle" font-size="11.5" fill="#5b6b7f">the scenery</text>

  <!-- L: overlay, transparent -->
  <rect x="665" y="72" width="175" height="128" fill="#ffffff"/>
  <g fill="#e6eaef">
    <rect x="665" y="74" width="22" height="20"/><rect x="709" y="74" width="22" height="20"/><rect x="753" y="74" width="22" height="20"/><rect x="797" y="74" width="22" height="20"/>
    <rect x="687" y="94" width="22" height="20"/><rect x="731" y="94" width="22" height="20"/><rect x="775" y="94" width="22" height="20"/><rect x="817" y="94" width="21" height="20"/>
    <rect x="665" y="180" width="22" height="18"/><rect x="709" y="180" width="22" height="18"/><rect x="753" y="180" width="22" height="18"/><rect x="797" y="180" width="22" height="18"/>
    <rect x="687" y="160" width="22" height="20"/><rect x="731" y="160" width="22" height="20"/><rect x="775" y="160" width="22" height="20"/><rect x="817" y="160" width="21" height="20"/>
  </g>
  <text x="674" y="135" font-size="13" font-weight="bold" fill="#c88a00">SCORE 100</text>
  <rect x="792" y="121" width="24" height="24" fill="#cc3a3a"/>
  <rect x="665" y="72" width="175" height="128" fill="none" stroke="#3a9a9a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="752" y="62"  text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">L — overlay layer</text>
  <text x="752" y="217" text-anchor="middle" font-size="11.5" fill="#5b6b7f">movers · black = see-through</text>

  <!-- copy F -> N -->
  <line x1="238" y1="136" x2="359" y2="136" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="127" text-anchor="middle" font-size="12" fill="#23272e">copy("F","N")</text>

  <!-- ===== compositing into the visible screen ===== -->
  <line x1="449" y1="228" x2="449" y2="302" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752" y1="228" x2="556" y2="302" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="262" text-anchor="middle" font-size="12" fill="#23272e">overlaid on top</text>
  <text x="556" y="278" text-anchor="middle" font-size="10.5" fill="#5b6b7f">(merged per scanline)</text>

  <!-- the monitor: N with L composited -->
  <rect x="352" y="306" width="194" height="146" rx="7" fill="#2a2f36"/>
  <rect x="362" y="316" width="174" height="126" fill="#d8ecfb"/>
  <rect x="362" y="392" width="174" height="50" fill="#d4ecc6"/>
  <circle cx="505" cy="346" r="16" fill="#e7b62e"/>
  <text x="371" y="356" font-size="12" font-weight="bold" fill="#c88a00">SCORE 100</text>
  <rect x="470" y="392" width="24" height="24" fill="#cc3a3a"/>
  <rect x="442" y="452" width="14" height="12" fill="#2a2f36"/>
  <rect x="410" y="464" width="78" height="8" rx="3" fill="#2a2f36"/>
  <text x="449" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">visible screen = N with L on top</text>
  <text x="449" y="509" text-anchor="middle" font-size="11.5" fill="#5b6b7f">this is what the monitor shows, 60×/s</text>
</svg>
