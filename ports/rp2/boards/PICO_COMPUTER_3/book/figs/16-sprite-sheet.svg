<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
    <g id="alien">
      <rect x="14" y="10" width="18" height="7" fill="#7fd0ff"/>
      <rect x="8" y="17" width="30" height="16" fill="#7fd0ff"/>
      <rect x="15" y="22" width="5" height="5" fill="#23272e"/>
      <rect x="26" y="22" width="5" height="5" fill="#23272e"/>
      <rect x="10" y="33" width="5" height="6" fill="#7fd0ff"/>
      <rect x="31" y="33" width="5" height="6" fill="#7fd0ff"/>
    </g>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect width="10" height="10" fill="#e6eaef"/>
      <rect x="10" y="10" width="10" height="10" fill="#e6eaef"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Sprite sheets — a grid of cells, magenta cut out</text>

  <!-- ===== the sheet ===== -->
  <text x="196" y="66" text-anchor="middle" font-size="13.5" fill="#3a4250">one image, many cells</text>
  <!-- col numbers -->
  <g font-size="12" fill="#5b6b7f" text-anchor="middle">
    <text x="93" y="82">0</text><text x="155" y="82">1</text><text x="217" y="82">2</text><text x="279" y="82">3</text>
  </g>
  <!-- row numbers -->
  <g font-size="12" fill="#5b6b7f" text-anchor="end">
    <text x="52" y="127">0</text><text x="52" y="189">1</text>
  </g>
  <rect x="62" y="88" width="248" height="124" fill="#ff00ff"/>
  <use href="#alien" x="72" y="98"/><use href="#alien" x="134" y="98"/><use href="#alien" x="196" y="98"/><use href="#alien" x="258" y="98"/>
  <use href="#alien" x="72" y="160"/><use href="#alien" x="134" y="160"/><use href="#alien" x="196" y="160"/><use href="#alien" x="258" y="160"/>
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="124" y1="88" x2="124" y2="212"/><line x1="186" y1="88" x2="186" y2="212"/><line x1="248" y1="88" x2="248" y2="212"/>
    <line x1="62" y1="150" x2="310" y2="150"/>
  </g>
  <!-- highlight cell (2,1) -->
  <rect x="186" y="150" width="62" height="62" fill="none" stroke="#d89000" stroke-width="3"/>
  <text x="217" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06000">img.cell(2, 1)</text>

  <!-- ===== skip colour ===== -->
  <text x="620" y="66" text-anchor="middle" font-size="13.5" fill="#3a4250">draw one cell with skip = magenta</text>
  <!-- source cell -->
  <rect x="490" y="96" width="90" height="90" fill="#ff00ff"/>
  <use href="#alien" transform="translate(513,120) scale(1.05)"/>
  <rect x="490" y="96" width="90" height="90" fill="none" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="535" y="204" text-anchor="middle" font-size="11.5" fill="#5b6b7f">magenta background</text>
  <!-- arrow -->
  <line x1="596" y1="141" x2="654" y2="141" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="132" text-anchor="middle" font-size="11.5" fill="#23272e">skip</text>
  <!-- result -->
  <rect x="670" y="96" width="90" height="90" fill="url(#checker)"/>
  <use href="#alien" transform="translate(693,120) scale(1.05)"/>
  <rect x="670" y="96" width="90" height="90" fill="none" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="715" y="204" text-anchor="middle" font-size="11.5" fill="#5b6b7f">magenta not drawn</text>

  <text x="430" y="300" text-anchor="middle" font-size="13.5" fill="#3a4250">Any pixel matching the skip colour (<tspan font-family="DejaVu Sans Mono, monospace">0xFF00FF</tspan>, a colour no artwork uses) is simply not copied,</text>
  <text x="430" y="322" text-anchor="middle" font-size="13.5" fill="#3a4250">so each sprite lands cut out, whatever it is drawn over.</text>
</svg>
