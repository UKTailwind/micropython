<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="820" height="430" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The geography — where everything lives</text>

  <!-- flash bar -->
  <text x="185" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#23272e">16 MB Flash</text>
  <rect x="120" y="98" width="130" height="72" fill="#1f5fbf"/>
  <text x="185" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Firmware</text>
  <text x="185" y="147" text-anchor="middle" font-size="11.5" fill="#dbe8fb">~4 MB</text>
  <rect x="120" y="170" width="130" height="220" fill="#2e8b57"/>
  <text x="185" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">/ filesystem</text>
  <text x="185" y="289" text-anchor="middle" font-size="11.5" fill="#d8f0e2">12 MB · LittleFS</text>
  <rect x="120" y="98" width="130" height="292" fill="none" stroke="#5b6b7f" stroke-width="1.6"/>

  <!-- firmware description -->
  <line x1="250" y1="134" x2="278" y2="134" stroke="#8a94a3" stroke-width="1.2"/>
  <text x="284" y="122" font-size="14" font-weight="bold" fill="#1f5fbf">Firmware region</text>
  <text x="284" y="142" font-size="12" fill="#3a4250">MicroPython + all frozen modules</text>
  <text x="284" y="162" font-size="12" fill="#5b6b7f">power-off: keeps <tspan fill="#2e8b57" font-weight="bold">✓</tspan>   ·   reflash: <tspan fill="#b3402e" font-weight="bold">replaced</tspan></text>

  <!-- / description -->
  <line x1="250" y1="280" x2="278" y2="280" stroke="#8a94a3" stroke-width="1.2"/>
  <text x="284" y="268" font-size="14" font-weight="bold" fill="#2e8b57">/  —  your files</text>
  <text x="284" y="288" font-size="12" fill="#3a4250">programs, scores, saves, settings.json</text>
  <text x="284" y="308" font-size="12" fill="#5b6b7f">power-off: keeps <tspan fill="#2e8b57" font-weight="bold">✓</tspan>   ·   reflash: <tspan fill="#2e8b57" font-weight="bold">kept ✓</tspan></text>

  <!-- PSRAM -->
  <rect x="560" y="104" width="240" height="92" rx="6" fill="#fbf3e2" stroke="#b08a3a" stroke-width="1.6"/>
  <text x="680" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06000">PSRAM — 8 MB heap</text>
  <text x="680" y="154" text-anchor="middle" font-size="12" fill="#3a4250">every running object lives here</text>
  <text x="680" y="176" text-anchor="middle" font-size="12" fill="#5b6b7f">power-off: <tspan fill="#b3402e" font-weight="bold">lost ✗</tspan>  (volatile)</text>

  <!-- SD -->
  <rect x="560" y="232" width="240" height="92" rx="6" fill="#f0f1f3" stroke="#8a94a3" stroke-width="1.6"/>
  <text x="680" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a4f57">SD card — /sd</text>
  <text x="680" y="282" text-anchor="middle" font-size="12" fill="#3a4250">the removable bridge to the world</text>
  <text x="680" y="304" text-anchor="middle" font-size="12" fill="#5b6b7f">power-off: keeps <tspan fill="#2e8b57" font-weight="bold">✓</tspan>  ·  pop it out anytime</text>

  <text x="410" y="415" text-anchor="middle" font-size="13.5" fill="#3a4250">Reflashing replaces the system and touches nothing of yours — everything precious lives in <tspan font-family="monospace" font-weight="bold">/</tspan>.</text>
</svg>
