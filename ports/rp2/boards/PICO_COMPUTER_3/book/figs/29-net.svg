<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="350" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Two ways to talk to the network</text>
  <line x1="418" y1="56" x2="418" y2="300" stroke="#e2e6ea" stroke-width="1.5"/>

  <!-- ===== HTTP ===== -->
  <text x="215" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5fbf">HTTP — ask a question</text>
  <rect x="50" y="130" width="120" height="60" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="110" y="165" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#23272e">your board</text>
  <rect x="275" y="130" width="120" height="60" rx="6" fill="#cfe6fb" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="335" y="165" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#23272e">web server</text>
  <line x1="170" y1="148" x2="273" y2="148" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="221" y="140" text-anchor="middle" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">get(url)</text>
  <line x1="273" y1="174" x2="172" y2="174" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="221" y="188" text-anchor="middle" font-size="11.5" fill="#3a4250">status + JSON</text>
  <text x="215" y="238" text-anchor="middle" font-size="12" fill="#5b6b7f">one question, one answer</text>

  <!-- ===== MQTT ===== -->
  <text x="645" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e8b57">MQTT — publish / subscribe</text>
  <rect x="600" y="146" width="110" height="60" rx="6" fill="#fbf3e2" stroke="#b08a3a" stroke-width="1.6"/>
  <text x="655" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06000">broker</text>
  <text x="655" y="192" text-anchor="middle" font-size="10.5" fill="#5b6b7f">(a post office)</text>
  <rect x="452" y="150" width="98" height="52" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="501" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#23272e">board A</text>
  <rect x="762" y="98" width="90" height="46" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="807" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#23272e">board B</text>
  <rect x="762" y="210" width="90" height="46" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
  <text x="807" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#23272e">board C</text>
  <line x1="550" y1="176" x2="598" y2="176" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="574" y="167" text-anchor="middle" font-size="10.5" fill="#3a4250">publish</text>
  <line x1="712" y1="164" x2="760" y2="130" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="712" y1="190" x2="760" y2="224" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="742" y="205" text-anchor="middle" font-size="10.5" fill="#3a4250">topic →</text>
  <text x="645" y="286" text-anchor="middle" font-size="12" fill="#5b6b7f">the broker relays to every subscriber</text>

  <text x="430" y="326" text-anchor="middle" font-size="13" fill="#3a4250">HTTP fetches data from a server; MQTT lets many machines chat by <tspan font-style="italic">topic</tspan> through a shared broker.</text>
</svg>
