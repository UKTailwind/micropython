<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Three coordinate systems for one spot</text>

  <!-- world grid -->
  <text x="225" y="62" text-anchor="middle" font-size="14" fill="#3a4250">the world — a grid of cells</text>
  <rect x="60" y="72" width="330" height="210" fill="#f3f7f2"/>
  <!-- highlighted cell (5,3) -->
  <rect x="210" y="162" width="30" height="30" fill="#f5d68a"/>
  <g stroke="#cdd5de" stroke-width="1">
    <line x1="90"  y1="72" x2="90"  y2="282"/><line x1="120" y1="72" x2="120" y2="282"/><line x1="150" y1="72" x2="150" y2="282"/><line x1="180" y1="72" x2="180" y2="282"/><line x1="210" y1="72" x2="210" y2="282"/><line x1="240" y1="72" x2="240" y2="282"/><line x1="270" y1="72" x2="270" y2="282"/><line x1="300" y1="72" x2="300" y2="282"/><line x1="330" y1="72" x2="330" y2="282"/><line x1="360" y1="72" x2="360" y2="282"/>
    <line x1="60" y1="102" x2="390" y2="102"/><line x1="60" y1="132" x2="390" y2="132"/><line x1="60" y1="162" x2="390" y2="162"/><line x1="60" y1="192" x2="390" y2="192"/><line x1="60" y1="222" x2="390" y2="222"/><line x1="60" y1="252" x2="390" y2="252"/>
  </g>
  <!-- viewport (the screen) top-left at cell (3,2) -->
  <rect x="150" y="132" width="180" height="120" fill="#1f5fbf" fill-opacity="0.06" stroke="#1f5fbf" stroke-width="2.5"/>
  <rect x="60" y="72" width="330" height="210" fill="none" stroke="#5b6b7f" stroke-width="1.6"/>
  <!-- camera offset -->
  <line x1="61" y1="73" x2="148" y2="130" stroke="#8a94a3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="240" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7f">view (vx, vy) = (48, 32)</text>
  <text x="154" y="150" font-size="11" fill="#1f5fbf">screen (0, 0)</text>
  <!-- the point -->
  <circle cx="210" cy="162" r="5.5" fill="#e0a81e" stroke="#8a5e00" stroke-width="1.5"/>
  <!-- labels/leaders -->
  <text x="248" y="160" font-size="11.5" font-weight="bold" fill="#8a5e00">world (80, 48)</text>
  <text x="410" y="196" font-size="12.5" fill="#1f5fbf">viewport = the screen</text>
  <line x1="408" y1="192" x2="332" y2="192" stroke="#1f5fbf" stroke-width="1.2"/>

  <!-- ===== the chain ===== -->
  <g>
    <rect x="95" y="322" width="170" height="56" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <text x="180" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">cell (5, 3)</text>
    <text x="180" y="366" text-anchor="middle" font-size="11.5" fill="#5b6b7f">column 5, row 3</text>

    <line x1="267" y1="350" x2="343" y2="350" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="305" y="341" text-anchor="middle" font-size="12.5" fill="#23272e">× 16</text>

    <rect x="345" y="322" width="190" height="56" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <text x="440" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">world (80, 48)</text>
    <text x="440" y="366" text-anchor="middle" font-size="11.5" fill="#5b6b7f">cell × 16 px</text>

    <line x1="537" y1="350" x2="613" y2="350" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="575" y="341" text-anchor="middle" font-size="12" fill="#23272e">− view</text>

    <rect x="615" y="322" width="190" height="56" rx="6" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.4"/>
    <text x="710" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">screen (32, 16)</text>
    <text x="710" y="366" text-anchor="middle" font-size="11.5" fill="#5b6b7f">world − camera</text>
  </g>

  <text x="450" y="418" text-anchor="middle" font-size="13.5" fill="#3a4250">One spot, three systems. Cells edit the map; world pixels place things; screen pixels are what you draw.</text>
  <text x="450" y="440" text-anchor="middle" font-size="12.5" fill="#5b6b7f">Coming back the other way: <tspan font-family="monospace">// 16</tspan> turns a world pixel into a cell.</text>
</svg>
