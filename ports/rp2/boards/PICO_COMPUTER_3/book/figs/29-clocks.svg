<svg xmlns="http://www.w3.org/2000/svg" width="860" height="356" viewBox="0 0 860 356" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="356" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Three clocks, and the shape of a time</text>

  <!-- DS3231 -->
  <rect x="25" y="48" width="250" height="104" rx="6" fill="#e6f4f4" stroke="#2a8a8a" stroke-width="1.5"/>
  <rect x="25" y="48" width="250" height="28" rx="6" fill="#2a8a8a"/><rect x="25" y="62" width="250" height="14" fill="#2a8a8a"/>
  <text x="40" y="68" font-size="13.5" font-weight="bold" fill="#fff">DS3231 — battery</text>
  <text x="40" y="98" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#23272e">gettime()</text>
  <text x="40" y="120" font-size="12" fill="#3a4250">survives power-off ✓</text>
  <text x="40" y="140" font-size="12" fill="#5b6b7f">dates, alarms, schedules</text>

  <!-- system -->
  <rect x="305" y="48" width="250" height="104" rx="6" fill="#eaf1fb" stroke="#1f5fbf" stroke-width="1.5"/>
  <rect x="305" y="48" width="250" height="28" rx="6" fill="#1f5fbf"/><rect x="305" y="62" width="250" height="14" fill="#1f5fbf"/>
  <text x="320" y="68" font-size="13.5" font-weight="bold" fill="#fff">system clock</text>
  <text x="320" y="98" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#23272e">time.localtime()</text>
  <text x="320" y="120" font-size="12" fill="#3a4250">reset from DS3231 at boot</text>
  <text x="320" y="140" font-size="12" fill="#5b6b7f">same time, cheaper to read</text>

  <!-- ticker -->
  <rect x="585" y="48" width="250" height="104" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="585" y="48" width="250" height="28" rx="6" fill="#6b7280"/><rect x="585" y="62" width="250" height="14" fill="#6b7280"/>
  <text x="600" y="68" font-size="13.5" font-weight="bold" fill="#fff">ms ticker</text>
  <text x="600" y="98" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#23272e">time.ticks_ms()</text>
  <text x="600" y="120" font-size="12" fill="#3a4250">no power-off, and it wraps</text>
  <text x="600" y="140" font-size="12" fill="#5b6b7f">durations, timeouts, budgets</text>

  <!-- arrow -->
  <line x1="277" y1="100" x2="303" y2="100" stroke="#23272e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="290" y="90" text-anchor="middle" font-size="10.5" fill="#5b6b7f">boot</text>

  <!-- time tuple -->
  <text x="430" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272e"><tspan font-family="monospace">gettime()</tspan> → an eight-number tuple</text>
  <g font-size="11.5" text-anchor="middle" fill="#5b6b7f">
    <text x="112" y="216">0</text><text x="200" y="216">1</text><text x="288" y="216">2</text><text x="376" y="216">3</text><text x="464" y="216">4</text><text x="552" y="216">5</text><text x="640" y="216">6</text><text x="728" y="216">7</text>
  </g>
  <g>
    <rect x="68" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="156" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="244" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="332" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="420" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="508" y="222" width="88" height="46" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.3"/>
    <rect x="596" y="222" width="88" height="46" fill="#fbf3e2" stroke="#c88a00" stroke-width="1.5"/>
    <rect x="684" y="222" width="88" height="46" fill="#fbf3e2" stroke="#c88a00" stroke-width="1.5"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#23272e">
    <text x="112" y="252">2026</text><text x="200" y="252">7</text><text x="288" y="252">16</text><text x="376" y="252">9</text><text x="464" y="252">30</text><text x="552" y="252">12</text><text x="640" y="252">3</text><text x="728" y="252">197</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#5b6b7f">
    <text x="112" y="286">year</text><text x="200" y="286">month</text><text x="288" y="286">day</text><text x="376" y="286">hour</text><text x="464" y="286">min</text><text x="552" y="286">sec</text><text x="640" y="286" fill="#a06000">weekday</text><text x="728" y="286" fill="#a06000">day-of-yr</text>
  </g>
  <text x="430" y="322" text-anchor="middle" font-size="12.5" fill="#3a4250">Positions 0–5 are the date and time; <tspan fill="#a06000" font-weight="bold">6</tspan> is the weekday (0 = Mon) and <tspan fill="#a06000" font-weight="bold">7</tspan> the day of the year.</text>
</svg>
