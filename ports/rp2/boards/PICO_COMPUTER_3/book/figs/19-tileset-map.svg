<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">A grid of numbers becomes a world</text>

  <!-- ===== tileset strip ===== -->
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#3a4250">the tileset — tiles 1–6  (index 0 = empty)</text>
  <!-- tile 1 grass -->
  <g><rect x="292" y="66" width="46" height="46" fill="#3a9a3a"/><circle cx="302" cy="78" r="2" fill="#217021"/><circle cx="320" cy="96" r="2" fill="#217021"/><circle cx="312" cy="84" r="2" fill="#217021"/></g>
  <!-- tile 2 water -->
  <g><rect x="346" y="66" width="46" height="46" fill="#1f5fbf"/><path d="M352,82 q6,-5 12,0 t12,0" fill="none" stroke="#7fb0ea" stroke-width="2"/><path d="M352,96 q6,-5 12,0 t12,0" fill="none" stroke="#7fb0ea" stroke-width="2"/></g>
  <!-- tile 3 tree -->
  <g><rect x="400" y="66" width="46" height="46" fill="#3a9a3a"/><rect x="420" y="92" width="6" height="12" fill="#7a4a1f"/><circle cx="423" cy="85" r="12" fill="#1f6b1f"/></g>
  <!-- tile 4 rock -->
  <g><rect x="454" y="66" width="46" height="46" fill="#3a9a3a"/><rect x="463" y="80" width="28" height="20" rx="6" fill="#9aa0a8"/></g>
  <!-- tile 5 flower -->
  <g><rect x="508" y="66" width="46" height="46" fill="#3a9a3a"/><circle cx="525" cy="82" r="4" fill="#d63aa0"/><circle cx="525" cy="82" r="1.6" fill="#e7c000"/><circle cx="538" cy="95" r="4" fill="#d63aa0"/><circle cx="538" cy="95" r="1.6" fill="#e7c000"/></g>
  <!-- tile 6 hero -->
  <g><rect x="562" y="66" width="46" height="46" fill="#3a9a3a"/><rect x="578" y="86" width="14" height="14" fill="#e0a81e"/><rect x="580" y="76" width="10" height="10" fill="#cfd3d8"/></g>
  <!-- numbers -->
  <g font-size="13" fill="#23272e" text-anchor="middle" font-weight="bold">
    <text x="315" y="128">1</text><text x="369" y="128">2</text><text x="423" y="128">3</text>
    <text x="477" y="128">4</text><text x="531" y="128">5</text><text x="585" y="128">6</text>
  </g>
  <!-- tile 3 highlighted -->
  <rect x="400" y="66" width="46" height="46" fill="none" stroke="#d89000" stroke-width="3"/>

  <!-- ===== indices grid (left) ===== -->
  <text x="211" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272e">map — indices</text>
  <g>
    <rect x="115" y="188" width="192" height="128" fill="#fbfbf8"/>
    <rect x="179" y="188" width="32" height="32" fill="#fbe9c8"/>
    <g stroke="#c8ccd2" stroke-width="1">
      <line x1="147" y1="188" x2="147" y2="316"/><line x1="179" y1="188" x2="179" y2="316"/><line x1="211" y1="188" x2="211" y2="316"/><line x1="243" y1="188" x2="243" y2="316"/><line x1="275" y1="188" x2="275" y2="316"/>
      <line x1="115" y1="220" x2="307" y2="220"/><line x1="115" y1="252" x2="307" y2="252"/><line x1="115" y1="284" x2="307" y2="284"/>
    </g>
    <rect x="115" y="188" width="192" height="128" fill="none" stroke="#5b6b7f" stroke-width="1.6"/>
    <g font-size="14" fill="#23272e" text-anchor="middle">
      <text x="131" y="210">1</text><text x="163" y="210">1</text><text x="195" y="210" font-weight="bold" fill="#a06000">3</text><text x="227" y="210">1</text><text x="259" y="210">1</text><text x="291" y="210">1</text>
      <text x="131" y="242">1</text><text x="163" y="242">1</text><text x="195" y="242">1</text><text x="227" y="242">1</text><text x="259" y="242">5</text><text x="291" y="242">1</text>
      <text x="131" y="274">2</text><text x="163" y="274">2</text><text x="195" y="274">2</text><text x="227" y="274">2</text><text x="259" y="274">2</text><text x="291" y="274">2</text>
      <text x="131" y="306">1</text><text x="163" y="306">4</text><text x="195" y="306">1</text><text x="227" y="306">1</text><text x="259" y="306">6</text><text x="291" y="306">1</text>
    </g>
  </g>

  <!-- arrow -->
  <line x1="330" y1="252" x2="470" y2="252" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="243" text-anchor="middle" font-size="13" fill="#23272e">tm.draw()</text>

  <!-- ===== rendered picture (right) ===== -->
  <text x="637" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272e">picture</text>
  <g>
    <!-- grass base -->
    <rect x="505" y="188" width="264" height="176" fill="#3a9a3a"/>
    <!-- water row (row 2) -->
    <rect x="505" y="276" width="264" height="44" fill="#1f5fbf"/>
    <path d="M515,298 q10,-6 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#7fb0ea" stroke-width="2"/>
    <!-- tree (col2,row0) x=505+88=593 y=188 -->
    <rect x="614" y="220" width="7" height="14" fill="#7a4a1f"/><circle cx="617" cy="212" r="14" fill="#1f6b1f"/>
    <!-- flower (col4,row1) x=681 y=232 -->
    <circle cx="695" cy="248" r="5" fill="#d63aa0"/><circle cx="695" cy="248" r="2" fill="#e7c000"/><circle cx="709" cy="256" r="5" fill="#d63aa0"/><circle cx="709" cy="256" r="2" fill="#e7c000"/>
    <!-- rock (col1,row3) x=549 y=320 -->
    <rect x="556" y="332" width="30" height="20" rx="6" fill="#9aa0a8"/>
    <!-- hero (col4,row3) x=681 y=320 -->
    <rect x="697" y="336" width="16" height="16" fill="#e0a81e"/><rect x="699" y="325" width="12" height="11" fill="#cfd3d8"/>
    <!-- grid -->
    <g stroke="#2c7a2c" stroke-width="1" opacity="0.6">
      <line x1="549" y1="188" x2="549" y2="364"/><line x1="593" y1="188" x2="593" y2="364"/><line x1="637" y1="188" x2="637" y2="364"/><line x1="681" y1="188" x2="681" y2="364"/><line x1="725" y1="188" x2="725" y2="364"/>
      <line x1="505" y1="232" x2="769" y2="232"/><line x1="505" y1="276" x2="769" y2="276"/><line x1="505" y1="320" x2="769" y2="320"/>
    </g>
    <rect x="505" y="188" width="264" height="176" fill="none" stroke="#5b6b7f" stroke-width="1.6"/>
    <!-- tree cell highlighted -->
    <rect x="593" y="188" width="44" height="44" fill="none" stroke="#d89000" stroke-width="3"/>
  </g>

  <text x="450" y="404" text-anchor="middle" font-size="13.5" fill="#3a4250">Each number picks its tile from the set — here <tspan font-weight="bold" fill="#a06000">index 3 → the tree tile</tspan>. Index 0 leaves a cell empty.</text>
  <text x="450" y="428" text-anchor="middle" font-size="13.5" fill="#3a4250">Six tiles and a grid of indices are a whole world for a few kilobytes.</text>
</svg>
