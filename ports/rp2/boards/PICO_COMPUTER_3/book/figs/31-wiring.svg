<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Two starter circuits</text>
  <line x1="450" y1="70" x2="450" y2="330" stroke="#e2e6ea" stroke-width="1.5"/>

  <!-- ================= LED ================= -->
  <text x="230" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">Light an LED</text>
  <!-- GP0 pad -->
  <circle cx="90" cy="180" r="6" fill="#7fb0d8" stroke="#23272e" stroke-width="1.2"/>
  <text x="90" y="164" text-anchor="middle" font-size="12.5" fill="#23272e">GP0</text>
  <!-- wire -->
  <line x1="96" y1="180" x2="140" y2="180" stroke="#23272e" stroke-width="2"/>
  <!-- resistor -->
  <polyline points="140,180 148,180 154,170 166,190 178,170 190,190 202,170 210,180 218,180" fill="none" stroke="#23272e" stroke-width="2"/>
  <text x="179" y="158" text-anchor="middle" font-size="12" fill="#23272e">330 Ω</text>
  <!-- wire -->
  <line x1="218" y1="180" x2="258" y2="180" stroke="#23272e" stroke-width="2"/>
  <!-- LED: triangle + cathode bar + light -->
  <polygon points="258,168 258,192 296,180" fill="#e57373" stroke="#b33636" stroke-width="1.5"/>
  <line x1="296" y1="166" x2="296" y2="194" stroke="#b33636" stroke-width="2.5"/>
  <line x1="276" y1="162" x2="286" y2="150" stroke="#e0a81e" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="288" y1="162" x2="298" y2="150" stroke="#e0a81e" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="277" y="212" text-anchor="middle" font-size="12" fill="#23272e">LED</text>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a81e"/></marker></defs>
  <!-- wire to GND -->
  <line x1="296" y1="180" x2="360" y2="180" stroke="#23272e" stroke-width="2"/>
  <!-- ground symbol -->
  <line x1="360" y1="180" x2="360" y2="196" stroke="#23272e" stroke-width="2"/>
  <line x1="348" y1="196" x2="372" y2="196" stroke="#23272e" stroke-width="2"/>
  <line x1="352" y1="202" x2="368" y2="202" stroke="#23272e" stroke-width="2"/>
  <line x1="356" y1="208" x2="364" y2="208" stroke="#23272e" stroke-width="2"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#23272e">GND</text>
  <!-- notes + code -->
  <text x="230" y="270" text-anchor="middle" font-size="12.5" fill="#5b6b7f">long leg (anode) toward GP0 · short leg to GND</text>
  <rect x="96" y="286" width="268" height="30" rx="4" fill="#f3f5f8"/>
  <text x="230" y="306" text-anchor="middle" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#23272e">led = Pin(0, Pin.OUT)</text>

  <!-- ================= Button ================= -->
  <text x="680" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">Read a button</text>
  <!-- 3.3V internal rail -->
  <line x1="600" y1="128" x2="720" y2="128" stroke="#e08a1e" stroke-width="2"/>
  <text x="660" y="120" text-anchor="middle" font-size="11.5" fill="#9a5c00">3.3 V (internal)</text>
  <!-- internal pull-up resistor (dashed) -->
  <polyline points="620,128 620,136 610,142 630,150 610,158 630,166 620,172 620,180" fill="none" stroke="#8a94a3" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="588" y="158" text-anchor="end" font-size="11" fill="#8a94a3">pull-up</text>
  <!-- GP1 node -->
  <circle cx="620" cy="180" r="6" fill="#7fb0d8" stroke="#23272e" stroke-width="1.2"/>
  <text x="606" y="184" text-anchor="end" font-size="12.5" fill="#23272e">GP1</text>
  <!-- wire to button -->
  <line x1="626" y1="180" x2="686" y2="180" stroke="#23272e" stroke-width="2"/>
  <!-- button (open switch) -->
  <circle cx="688" cy="180" r="3" fill="#23272e"/>
  <line x1="688" y1="180" x2="726" y2="166" stroke="#23272e" stroke-width="2"/>
  <circle cx="730" cy="180" r="3" fill="#23272e"/>
  <line x1="707" y1="150" x2="707" y2="160" stroke="#23272e" stroke-width="2"/>
  <text x="709" y="146" text-anchor="middle" font-size="12" fill="#23272e">button</text>
  <!-- wire to GND -->
  <line x1="730" y1="180" x2="790" y2="180" stroke="#23272e" stroke-width="2"/>
  <line x1="790" y1="180" x2="790" y2="196" stroke="#23272e" stroke-width="2"/>
  <line x1="778" y1="196" x2="802" y2="196" stroke="#23272e" stroke-width="2"/>
  <line x1="782" y1="202" x2="798" y2="202" stroke="#23272e" stroke-width="2"/>
  <line x1="786" y1="208" x2="794" y2="208" stroke="#23272e" stroke-width="2"/>
  <text x="790" y="228" text-anchor="middle" font-size="12" fill="#23272e">GND</text>
  <!-- notes + code -->
  <text x="680" y="270" text-anchor="middle" font-size="12.5" fill="#5b6b7f">held at 1 by the pull-up · pressing pulls it to 0</text>
  <rect x="560" y="286" width="300" height="30" rx="4" fill="#f3f5f8"/>
  <text x="710" y="306" text-anchor="middle" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#23272e">btn = Pin(1, Pin.IN, Pin.PULL_UP)</text>
</svg>
