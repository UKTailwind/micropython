<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5e00"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Rotation from two lines of trig</text>

  <!-- ===== geometry (left) ===== -->
  <!-- up reference -->
  <line x1="300" y1="288" x2="300" y2="120" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#5b6b7f">0° (up)</text>
  <!-- components -->
  <line x1="300" y1="288" x2="396" y2="288" stroke="#1f5fbf" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="348" y="306" text-anchor="middle" font-size="12" fill="#1f5fbf">sin(a)·d</text>
  <line x1="396" y1="288" x2="396" y2="173" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="440" y="234" text-anchor="middle" font-size="12" fill="#2e8b57">cos(a)·d</text>
  <!-- heading arrow -->
  <line x1="300" y1="288" x2="392" y2="177" stroke="#8a5e00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- angle arc -->
  <path d="M300,238 A50,50 0 0,1 332,250" fill="none" stroke="#b3402e" stroke-width="1.8"/>
  <text x="322" y="228" font-size="13" font-weight="bold" fill="#b3402e">a</text>
  <!-- points -->
  <circle cx="300" cy="288" r="5" fill="#23272e"/>
  <text x="292" y="308" text-anchor="end" font-size="12" fill="#23272e">ship (cx, cy)</text>
  <circle cx="396" cy="173" r="5.5" fill="#e0a81e" stroke="#8a5e00" stroke-width="1.5"/>
  <text x="404" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5e00">the point — d away, angle a</text>

  <!-- ===== formula + convention (right) ===== -->
  <rect x="512" y="96" width="288" height="96" rx="6" fill="#f3f5f8"/>
  <text x="528" y="122" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">def pt(cx, cy, a, d):</text>
  <text x="528" y="144" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">    r = radians(a)</text>
  <text x="528" y="166" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">    return (cx + sin(r)*d,</text>
  <text x="528" y="184" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">            cy - cos(r)*d)</text>

  <text x="512" y="228" font-size="13" fill="#3a4250">0° = up · 90° = right · clockwise</text>
  <text x="512" y="252" font-size="13" fill="#3a4250"><tspan fill="#1f5fbf" font-weight="bold">sin</tspan> → the x-step, <tspan fill="#2e8b57" font-weight="bold">−cos</tspan> → the y-step</text>
  <text x="512" y="272" font-size="11.5" fill="#5b6b7f">(minus because screen y runs downward)</text>

  <text x="410" y="360" text-anchor="middle" font-size="13.5" fill="#3a4250">One position and one heading place the ship's nose, its wingtips, its flame — or a bullet's launch.</text>
  <text x="410" y="384" text-anchor="middle" font-size="12.5" fill="#5b6b7f">Add that same step to the ship's <tspan font-style="italic">velocity</tspan> (not its position) and you get Asteroids' famous drift.</text>
</svg>
