<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Northwind — the core tables</text>
  <text x="480" y="55" text-anchor="middle" font-size="12.5" fill="#5b6b7f">each fact kept once; the full database (Appendix J) also has Suppliers, Shippers and Employees</text>

  <!-- arrows first, so the boxes sit on top of the line ends -->
  <g stroke="#5b6b7f" stroke-width="2" fill="none">
    <line x1="650" y1="150" x2="702" y2="140" marker-end="url(#arrow)"/>
    <line x1="300" y1="292" x2="444" y2="216" marker-end="url(#arrow)"/>
    <line x1="300" y1="334" x2="372" y2="355" marker-end="url(#arrow)"/>
    <line x1="645" y1="392" x2="712" y2="367" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#8a5e00" font-style="italic">
    <text x="606" y="135">CustomerID</text>
    <text x="360" y="250">OrderID</text>
    <text x="312" y="360">ProductID</text>
    <text x="628" y="372">CategoryID</text>
  </g>

  <!-- Customers -->
  <rect x="700" y="78" width="250" height="144" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="700" y="78" width="250" height="26" rx="6" fill="#1f5fbf"/>
  <text x="825" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Customers</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="714" y="126">CustomerID</text><text x="936" y="126" text-anchor="end" fill="#2e8b57">key</text>
    <text x="714" y="152">CompanyName</text>
    <text x="714" y="178">City</text>
    <text x="714" y="204">Country</text>
  </g>

  <!-- Orders -->
  <rect x="370" y="94" width="230" height="118" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="370" y="94" width="230" height="26" rx="6" fill="#1f5fbf"/>
  <text x="485" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Orders</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="384" y="142">OrderID</text><text x="586" y="142" text-anchor="end" fill="#2e8b57">key</text>
    <text x="384" y="168">CustomerID</text><text x="586" y="168" text-anchor="end" fill="#b3402e">→ Customers</text>
    <text x="384" y="194">OrderDate</text>
  </g>

  <!-- OrderDetails -->
  <rect x="60" y="250" width="240" height="118" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="60" y="250" width="240" height="26" rx="6" fill="#1f5fbf"/>
  <text x="180" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">OrderDetails</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="74" y="298">OrderID</text><text x="286" y="298" text-anchor="end" fill="#b3402e">→ Orders</text>
    <text x="74" y="324">ProductID</text><text x="286" y="324" text-anchor="end" fill="#b3402e">→ Products</text>
    <text x="74" y="350">Quantity</text>
  </g>

  <!-- Products -->
  <rect x="370" y="300" width="235" height="144" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="370" y="300" width="235" height="26" rx="6" fill="#1f5fbf"/>
  <text x="487" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Products</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="384" y="348">ProductID</text><text x="591" y="348" text-anchor="end" fill="#2e8b57">key</text>
    <text x="384" y="374">ProductName</text>
    <text x="384" y="400">CategoryID</text><text x="591" y="400" text-anchor="end" fill="#b3402e">→ Categories</text>
    <text x="384" y="426">UnitPrice</text>
  </g>

  <!-- Categories -->
  <rect x="705" y="324" width="245" height="92" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="705" y="324" width="245" height="26" rx="6" fill="#1f5fbf"/>
  <text x="827" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Categories</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="719" y="372">CategoryID</text><text x="936" y="372" text-anchor="end" fill="#2e8b57">key</text>
    <text x="719" y="398">CategoryName</text>
  </g>

  <text x="480" y="476" text-anchor="middle" font-size="13" fill="#3a4250">"What did Berglunds buy in July?" is a path through the arrows — Customers → Orders → OrderDetails → Products — written as one JOIN.</text>
</svg>
