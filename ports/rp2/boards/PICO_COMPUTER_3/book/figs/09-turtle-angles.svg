<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3402e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Why 360/n makes a polygon — and overshooting makes a star</text>

  <!-- ===== pentagon ===== -->
  <polygon points="190,116 276,178 243,279 137,279 104,178" fill="#eef4fb" stroke="#1f5fbf" stroke-width="2.5"/>
  <g fill="#1f5fbf"><circle cx="190" cy="116" r="4"/><circle cx="276" cy="178" r="4"/><circle cx="243" cy="279" r="4"/><circle cx="137" cy="279" r="4"/><circle cx="104" cy="178" r="4"/></g>
  <path d="M172,106 A24,24 0 0,1 208,106" fill="none" stroke="#b3402e" stroke-width="2" marker-end="url(#turn)"/>
  <text x="190" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402e">turn 72°</text>
  <text x="190" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1f5fbf">regular pentagon</text>
  <text x="190" y="336" text-anchor="middle" font-size="12" fill="#5b6b7f">turn 360/5 = 72° · 5 turns = 360°</text>
  <text x="190" y="354" text-anchor="middle" font-size="12" fill="#5b6b7f">once around — the path closes</text>

  <!-- ===== star ===== -->
  <polygon points="620,116 673,279 534,178 706,178 567,279" fill="#fdf6e6" stroke="#c88a00" stroke-width="2.5"/>
  <g fill="#c88a00"><circle cx="620" cy="116" r="4"/><circle cx="673" cy="279" r="4"/><circle cx="534" cy="178" r="4"/><circle cx="706" cy="178" r="4"/><circle cx="567" cy="279" r="4"/></g>
  <path d="M602,106 A24,24 0 0,1 638,106" fill="none" stroke="#b3402e" stroke-width="2" marker-end="url(#turn)"/>
  <text x="620" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402e">turn 144°</text>
  <text x="620" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06000">five-pointed star</text>
  <text x="620" y="336" text-anchor="middle" font-size="12" fill="#5b6b7f">turn 144° · 5 turns = 720°</text>
  <text x="620" y="354" text-anchor="middle" font-size="12" fill="#5b6b7f">twice around — so it crosses itself</text>

  <text x="410" y="384" text-anchor="middle" font-size="12.5" fill="#3a4250">The corner turns must add up to a whole number of full circles for the turtle to get home.</text>
</svg>
