<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="410" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">A class is a blueprint; each object is stamped from it</text>

  <!-- blueprint -->
  <rect x="50" y="66" width="284" height="284" rx="6" fill="#f7f9fc" stroke="#5b6b7f" stroke-width="1.6"/>
  <rect x="50" y="66" width="284" height="34" rx="6" fill="#1f5fbf"/>
  <rect x="50" y="86" width="284" height="14" fill="#1f5fbf"/>
  <text x="66" y="89" font-size="15" font-weight="bold" fill="#fff" font-family="DejaVu Sans Mono, monospace">class Hero</text>
  <text x="66" y="128" font-size="12" font-weight="bold" fill="#5b6b7f">attributes — each object gets its own:</text>
  <g font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">
    <text x="78" y="152">name</text><text x="78" y="174">health</text><text x="78" y="196">gold</text>
  </g>
  <line x1="66" y1="214" x2="318" y2="214" stroke="#dde2e8" stroke-width="1"/>
  <text x="66" y="238" font-size="12" font-weight="bold" fill="#5b6b7f">methods — shared by all:</text>
  <g font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">
    <text x="78" y="262">take_damage()</text><text x="78" y="284">drink_potion()</text><text x="78" y="306">is_alive()</text>
  </g>

  <!-- instance h -->
  <rect x="556" y="60" width="278" height="120" rx="6" fill="#eafaf1" stroke="#2e8b57" stroke-width="1.6"/>
  <rect x="556" y="60" width="278" height="30" rx="6" fill="#2e8b57"/>
  <rect x="556" y="76" width="278" height="14" fill="#2e8b57"/>
  <text x="572" y="81" font-size="13.5" font-weight="bold" fill="#fff" font-family="DejaVu Sans Mono, monospace">h  (a Hero)</text>
  <g font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">
    <text x="572" y="114">name   = "Ada"</text><text x="572" y="138">health = 20</text><text x="572" y="162">gold   = 0</text>
  </g>

  <!-- instance g -->
  <rect x="556" y="216" width="278" height="120" rx="6" fill="#eafaf1" stroke="#2e8b57" stroke-width="1.6"/>
  <rect x="556" y="216" width="278" height="30" rx="6" fill="#2e8b57"/>
  <rect x="556" y="232" width="278" height="14" fill="#2e8b57"/>
  <text x="572" y="237" font-size="13.5" font-weight="bold" fill="#fff" font-family="DejaVu Sans Mono, monospace">g  (a Hero)</text>
  <g font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#23272e">
    <text x="572" y="270">name   = "Grumble"</text><text x="572" y="294">health = 8</text><text x="572" y="318">gold   = 0</text>
  </g>

  <!-- arrows -->
  <line x1="336" y1="150" x2="554" y2="118" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="120" text-anchor="middle" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#23272e">Hero("Ada")</text>
  <line x1="336" y1="252" x2="554" y2="276" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="292" text-anchor="middle" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#23272e">Hero("Grumble", 8)</text>

  <text x="430" y="384" text-anchor="middle" font-size="13.5" fill="#3a4250">One blueprint, independent objects: each keeps its <tspan font-style="italic">own</tspan> attribute values, while the methods are shared.</text>
</svg>
