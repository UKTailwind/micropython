<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">The Traders database — five tables, linked by id columns</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#5b6b7f">each fact kept once · a JOIN follows an arrow from a child table to its parent's key</text>

  <!-- arrows first, so the boxes sit on top of the line ends -->
  <g stroke="#5b6b7f" stroke-width="2" fill="none">
    <line x1="535" y1="150" x2="604" y2="140" marker-end="url(#arrow)"/>
    <line x1="256" y1="292" x2="406" y2="216" marker-end="url(#arrow)"/>
    <line x1="256" y1="332" x2="324" y2="352" marker-end="url(#arrow)"/>
    <line x1="545" y1="386" x2="614" y2="362" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#8a5e00" font-style="italic">
    <text x="566" y="138">CustID</text>
    <text x="322" y="248">OrderID</text>
    <text x="276" y="356">ProdID</text>
    <text x="565" y="368">CatID</text>
  </g>

  <!-- Customers -->
  <rect x="610" y="80" width="230" height="118" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="610" y="80" width="230" height="26" rx="6" fill="#1f5fbf"/>
  <text x="725" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Customers</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="624" y="130">CustID</text><text x="806" y="130" text-anchor="end" fill="#2e8b57">key</text>
    <text x="624" y="156">Name</text>
    <text x="624" y="182">City</text>
  </g>

  <!-- Orders -->
  <rect x="330" y="96" width="205" height="118" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="330" y="96" width="205" height="26" rx="6" fill="#1f5fbf"/>
  <text x="432" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Orders</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="344" y="146">OrderID</text><text x="521" y="146" text-anchor="end" fill="#2e8b57">key</text>
    <text x="344" y="172">CustID</text><text x="521" y="172" text-anchor="end" fill="#b3402e">→ Customers</text>
    <text x="344" y="198">OrderDate</text>
  </g>

  <!-- Lines -->
  <rect x="60" y="250" width="196" height="118" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="60" y="250" width="196" height="26" rx="6" fill="#1f5fbf"/>
  <text x="158" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Lines</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="74" y="300">OrderID</text><text x="242" y="300" text-anchor="end" fill="#b3402e">→ Orders</text>
    <text x="74" y="326">ProdID</text><text x="242" y="326" text-anchor="end" fill="#b3402e">→ Products</text>
    <text x="74" y="352">Qty</text>
  </g>

  <!-- Products -->
  <rect x="330" y="298" width="215" height="142" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="330" y="298" width="215" height="26" rx="6" fill="#1f5fbf"/>
  <text x="437" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Products</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="344" y="348">ProdID</text><text x="531" y="348" text-anchor="end" fill="#2e8b57">key</text>
    <text x="344" y="374">Name</text>
    <text x="344" y="400">CatID</text><text x="531" y="400" text-anchor="end" fill="#b3402e">→ Categories</text>
    <text x="344" y="426">Price</text>
  </g>

  <!-- Categories -->
  <rect x="620" y="322" width="215" height="94" rx="6" fill="#ffffff" stroke="#5b6b7f" stroke-width="1.4"/>
  <rect x="620" y="322" width="215" height="26" rx="6" fill="#1f5fbf"/>
  <text x="727" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Categories</text>
  <g font-size="12.5" fill="#3a4250">
    <text x="634" y="372">CatID</text><text x="816" y="372" text-anchor="end" fill="#2e8b57">key</text>
    <text x="634" y="398">Name</text>
  </g>

  <text x="450" y="462" text-anchor="middle" font-size="13" fill="#3a4250">"What did Berglunds buy in July?" is a path through the arrows — Customers → Orders → Lines → Products — written as one JOIN.</text>
</svg>
