<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23272e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Double buffering — build the frame in private, reveal it whole</text>

  <!-- F: hidden buffer -->
  <rect x="60" y="95" width="230" height="100" fill="#d8ecfb"/>
  <rect x="60" y="195" width="230" height="70" fill="#d4ecc6"/>
  <circle cx="245" cy="131" r="20" fill="#e7b62e"/>
  <rect x="100" y="192" width="24" height="24" fill="#cc3a3a"/>
  <rect x="60" y="95" width="230" height="170" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="175" y="84"  text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">F — hidden buffer</text>
  <text x="175" y="288" text-anchor="middle" font-size="12.5" fill="#5b6b7f">① clear   ② draw the whole scene</text>

  <!-- N: visible -->
  <rect x="610" y="95" width="230" height="100" fill="#d8ecfb"/>
  <rect x="610" y="195" width="230" height="70" fill="#d4ecc6"/>
  <circle cx="795" cy="131" r="20" fill="#e7b62e"/>
  <rect x="650" y="192" width="24" height="24" fill="#cc3a3a"/>
  <rect x="610" y="95" width="230" height="170" fill="none" stroke="#5b6b7f" stroke-width="2.5"/>
  <text x="725" y="84"  text-anchor="middle" font-size="15" font-weight="bold" fill="#23272e">N — visible screen</text>
  <text x="725" y="288" text-anchor="middle" font-size="12.5" fill="#5b6b7f">the finished frame, all at once</text>

  <!-- pipeline: F -> (vsync gap) -> copy -> N -->
  <line x1="292" y1="180" x2="424" y2="180" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="180" x2="608" y2="180" stroke="#23272e" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="450" cy="180" r="24" fill="#eef3f8" stroke="#5b6b7f" stroke-width="1.5"/>
  <line x1="450" y1="180" x2="450" y2="163" stroke="#23272e" stroke-width="2"/>
  <line x1="450" y1="180" x2="463" y2="180" stroke="#23272e" stroke-width="2"/>
  <text x="358" y="169" text-anchor="middle" font-size="12.5" fill="#23272e">hdmi.vsync()</text>
  <text x="542" y="169" text-anchor="middle" font-size="12.5" fill="#23272e">copy("F","N")</text>
  <text x="450" y="224" text-anchor="middle" font-size="11" fill="#5b6b7f">the quiet gap</text>

  <!-- loop back -->
  <path d="M725,268 L725,330 L175,330 L175,268" fill="none" stroke="#8a94a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="450" y="324" text-anchor="middle" font-size="12" fill="#5b6b7f">repeat every frame (60×/s)</text>

  <text x="450" y="384" text-anchor="middle" font-size="14" fill="#3a4250">Nobody sees F being drawn, so <tspan font-weight="bold">N never shows a half-finished frame</tspan> — flicker becomes impossible.</text>
</svg>
