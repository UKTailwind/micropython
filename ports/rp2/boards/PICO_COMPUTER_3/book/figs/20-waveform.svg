<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="860" height="340" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Sound is a wave — its speed is pitch, its size is volume</text>

  <!-- ===== frequency panel ===== -->
  <text x="265" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5fbf">frequency = pitch</text>
  <line x1="110" y1="110" x2="420" y2="110" stroke="#cdd5de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M110,110 Q148.75,62 187.5,110 Q226.25,158 265,110 Q303.75,62 342.5,110 Q381.25,158 420,110" fill="none" stroke="#1f5fbf" stroke-width="2.4"/>
  <text x="100" y="114" text-anchor="end" font-size="12.5" fill="#3a4250">low note</text>
  <line x1="110" y1="185" x2="420" y2="185" stroke="#cdd5de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M110,185 Q129.375,137 148.75,185 Q168.125,233 187.5,185 Q206.875,137 226.25,185 Q245.625,233 265,185 Q284.375,137 303.75,185 Q323.125,233 342.5,185 Q361.875,137 381.25,185 Q400.625,233 420,185" fill="none" stroke="#1f5fbf" stroke-width="2.4"/>
  <text x="100" y="189" text-anchor="end" font-size="12.5" fill="#3a4250">high note</text>
  <text x="265" y="256" text-anchor="middle" font-size="11.5" fill="#5b6b7f">more cycles per second = higher note</text>

  <!-- divider -->
  <line x1="450" y1="60" x2="450" y2="270" stroke="#e2e6ea" stroke-width="1.5"/>

  <!-- ===== amplitude panel ===== -->
  <text x="645" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e8b57">amplitude = volume</text>
  <line x1="490" y1="110" x2="800" y2="110" stroke="#cdd5de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M490,110 Q515.83,88 541.67,110 Q567.5,132 593.33,110 Q619.17,88 645,110 Q670.83,132 696.67,110 Q722.5,88 748.33,110 Q774.17,132 800,110" fill="none" stroke="#2e8b57" stroke-width="2.4"/>
  <text x="480" y="114" text-anchor="end" font-size="12.5" fill="#3a4250">quiet</text>
  <line x1="490" y1="185" x2="800" y2="185" stroke="#cdd5de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M490,185 Q515.83,121 541.67,185 Q567.5,249 593.33,185 Q619.17,121 645,185 Q670.83,249 696.67,185 Q722.5,121 748.33,185 Q774.17,249 800,185" fill="none" stroke="#2e8b57" stroke-width="2.4"/>
  <text x="480" y="189" text-anchor="end" font-size="12.5" fill="#3a4250">loud</text>
  <text x="645" y="256" text-anchor="middle" font-size="11.5" fill="#5b6b7f">taller wave = louder sound</text>

  <text x="430" y="304" text-anchor="middle" font-size="13.5" fill="#3a4250">A pure sine wave — <tspan font-family="monospace">tone()</tspan> plays one per ear. A = 440 Hz; double the frequency and the note jumps an octave.</text>
</svg>
