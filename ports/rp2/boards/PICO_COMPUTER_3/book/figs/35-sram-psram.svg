<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272e">Two kinds of memory — fast and near, or big and far</text>

  <!-- CPU -->
  <rect x="70" y="140" width="140" height="120" rx="8" fill="#2a2f36"/>
  <text x="140" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">RP2350B</text>
  <text x="140" y="212" text-anchor="middle" font-size="12" fill="#c8ccd2">cores</text>
  <text x="140" y="232" text-anchor="middle" font-size="12" fill="#c8ccd2">252 MHz</text>

  <!-- fat fast bus -->
  <rect x="210" y="186" width="92" height="28" fill="#9aa6b3"/>
  <text x="256" y="178" text-anchor="middle" font-size="11.5" fill="#3a4250">wide · fast</text>

  <!-- SRAM -->
  <rect x="300" y="140" width="164" height="120" rx="6" fill="#cfe6fb" stroke="#5b6b7f" stroke-width="2"/>
  <text x="382" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272e">on-chip SRAM</text>
  <text x="382" y="204" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f5fbf">512 KB</text>
  <text x="382" y="226" text-anchor="middle" font-size="11" fill="#5b6b7f">1–2 cycles away</text>
  <text x="382" y="244" text-anchor="middle" font-size="11" fill="#5b6b7f">holds the video RAM</text>

  <!-- long thin slow bus -->
  <line x1="464" y1="200" x2="676" y2="200" stroke="#b3402e" stroke-width="3"/>
  <line x1="464" y1="200" x2="676" y2="200" stroke="#b3402e" stroke-width="3" stroke-dasharray="1 0"/>
  <text x="570" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402e">serial bus — the toll</text>
  <text x="570" y="218" text-anchor="middle" font-size="11" fill="#5b6b7f">several× slower per byte</text>

  <!-- PSRAM -->
  <rect x="676" y="140" width="184" height="120" rx="6" fill="#f3efe2" stroke="#b08a3a" stroke-width="2"/>
  <text x="768" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272e">external PSRAM</text>
  <text x="768" y="204" text-anchor="middle" font-size="20" font-weight="bold" fill="#a06000">8 MB</text>
  <text x="768" y="226" text-anchor="middle" font-size="11" fill="#5b6b7f">the Python heap</text>
  <text x="768" y="244" text-anchor="middle" font-size="11" fill="#5b6b7f">palatial — but out of town</text>

  <text x="450" y="316" text-anchor="middle" font-size="13.5" fill="#3a4250">Every object lives in the roomy PSRAM; the screen and fast buffers live in the small SRAM.</text>
  <text x="450" y="338" text-anchor="middle" font-size="13.5" fill="#3a4250">An F buffer left in PSRAM pays the toll <tspan font-weight="bold">twice every frame</tspan> — draw, then copy. That is the cost to beat.</text>
</svg>
